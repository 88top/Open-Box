name: Sync upstream

# 上游 liandu2024/Open-Box 出新版本时,把它 release 包里的文件同步过来(含编译后的前端和 *.so),
# 仓库地址换回自己的,直接提交到目标分支。
# 内核不在这里处理:release.yml 每次构建都会自动取上游 Latest 的 x64 / arm64 内核。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 指定上游版本(留空 = Latest)
        required: false
        default: ''
      force:
        description: 版本相同也强制重新同步
        type: boolean
        default: false
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

env:
  UPSTREAM_REPO: liandu2024/Open-Box
  OWN_REPO: timeflysoon/Open-Box
  BASE_BRANCH: ${{ vars.SYNC_BASE_BRANCH || 'catch-up-upstream' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Sync files from upstream release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eu

          # 1. 定下上游版本
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(curl -sI --retry 3 --connect-timeout 20 "https://github.com/$UPSTREAM_REPO/releases/latest" \
              | tr -d '\r' | sed -n 's/^[Ll]ocation: .*\/releases\/tag\/\(v[0-9][0-9A-Za-z._-]*\).*/\1/p' | head -n 1)
          fi
          case "$tag" in v[0-9]*) ;; *) echo "无法确定上游版本:「$tag」" >&2; exit 1 ;; esac
          echo "上游版本:$tag"

          last=$(cat .upstream-synced 2>/dev/null || true)
          # arm64 原生内核(scripts/native-arm64)缺了也要补:这个目录是后来才加进同步流程的,
          # 只比版本号的话,早就同步到最新版的分支永远补不上它,发布 arm64 包时才发现
          if [ "$last" = "$tag" ] && [ "$FORCE" != true ] \
            && [ -f scripts/native-arm64/openbox-core ] && [ -f scripts/native-arm64/core-build.json ]; then
            echo "已同步到 $tag,无需处理"
            exit 0
          fi

          # 2. 下载 app 组件(含 openwrt、debian、panel、update.sh、uninstall.sh),校验 sha256
          base="https://github.com/$UPSTREAM_REPO/releases/download/$tag"
          curl -fsSL --retry 3 -o components.json "$base/open-box-$tag-linux-x64-components.json"
          set -- $(python3 -c 'import json,sys;a=json.load(open(sys.argv[1]))["components"]["app"];print(a["asset"],a["sha256"])' components.json)
          asset=$1; sha=$2
          curl -fsSL --retry 3 -o app.tar.gz "$base/$asset"
          echo "$sha  app.tar.gz" | sha256sum -c -
          mkdir app && tar -xzf app.tar.gz -C app

          # 2b. arm64 的原生内核:仓库里的 panel/server/native 来自上面 x64 的应用包(amd64),
          #     arm64 的发布包必须换成上游 arm64 应用包里的那一份(scripts/build-release.sh 打 arm64 包时替换)。
          #     只留 native 两个文件;上游 arm64 包里的 native 不是 linux/arm64 就直接失败,不带错的内核进仓库。
          curl -fsSL --retry 3 -o components-arm64.json "$base/open-box-$tag-linux-arm64-components.json"
          set -- $(python3 -c 'import json,sys;a=json.load(open(sys.argv[1]))["components"]["app"];print(a["asset"],a["sha256"])' components-arm64.json)
          asset_arm64=$1; sha_arm64=$2
          curl -fsSL --retry 3 -o app-arm64.tar.gz "$base/$asset_arm64"
          echo "$sha_arm64  app-arm64.tar.gz" | sha256sum -c -
          mkdir app-arm64 && tar -xzf app-arm64.tar.gz -C app-arm64
          mkdir -p scripts/native-arm64
          cp app-arm64/panel/server/native/openbox-core app-arm64/panel/server/native/core-build.json scripts/native-arm64/
          chmod +x scripts/native-arm64/openbox-core
          python3 - <<'PY'
          import json
          c = json.load(open('scripts/native-arm64/core-build.json'))
          if c.get('os') != 'linux' or c.get('arch') != 'arm64':
              raise SystemExit('上游 arm64 应用包里的原生内核不是 linux/arm64:' + json.dumps(c))
          print('arm64 原生内核:', c.get('buildID'))
          PY
          rm -rf app-arm64 app-arm64.tar.gz components-arm64.json

          # 3. 覆盖(不删除你自己新增的文件)
          rsync -a app/openwrt/ openwrt/
          rsync -a app/debian/ debian/
          # panel/: 整个面板(明文后端 + 编译后的前端)整体覆盖;不动依赖清单,不带 node_modules
          [ -d app/panel/server ] || { echo "上游包里没有 panel/server,目录结构变了" >&2; exit 1; }
          rsync -a --exclude='node_modules' --exclude='/package.json' --exclude='/pnpm-lock.yaml' app/panel/ panel/
          cp app/update.sh scripts/update.sh
          cp app/uninstall.sh scripts/uninstall.sh
          # install.sh 不在 release 包里,取上游该版本的源码
          curl -fsSL --retry 3 -o scripts/install.sh "https://raw.githubusercontent.com/$UPSTREAM_REPO/$tag/scripts/install.sh"
          chmod +x scripts/install.sh scripts/update.sh scripts/uninstall.sh

          # 3b. Docker:docker/ 目录和 scripts/build-docker.sh 在上游源码里(不在 release 包里),按同一版本取。
          #     docker/ 完全跟随上游(会删掉上游已经没有的文件);旧版本的源码里没有 docker/ 就只警告、不失败。
          curl -fsSL --retry 3 -o upstream-src.tar.gz "https://codeload.github.com/$UPSTREAM_REPO/tar.gz/refs/tags/$tag"
          mkdir upstream-src && tar -xzf upstream-src.tar.gz -C upstream-src --strip-components=1
          if [ -d upstream-src/docker ] && [ -f upstream-src/scripts/build-docker.sh ]; then
            mkdir -p docker
            rsync -a --delete upstream-src/docker/ docker/
            cp upstream-src/scripts/build-docker.sh scripts/build-docker.sh
            chmod +x scripts/build-docker.sh
          else
            echo "::warning::上游 $tag 的源码里没有 docker/ 或 scripts/build-docker.sh,本次不同步 Docker 部分"
          fi
          rm -rf upstream-src upstream-src.tar.gz

          # 4. 仓库地址换回自己的(panel 里的 updater.mjs 和前端文件也要换,否则面板会去检查上游版本)
          targets="openwrt debian scripts/install.sh scripts/update.sh scripts/uninstall.sh"
          if [ -d docker ] && [ -f scripts/build-docker.sh ]; then targets="$targets docker scripts/build-docker.sh"; fi
          grep -rlI "$UPSTREAM_REPO" $targets panel | xargs -r sed -i "s#$UPSTREAM_REPO#$OWN_REPO#g"
          if grep -rnI "liandu2024" $targets; then
            echo "仍有指向上游的残留(见上),请人工处理后再同步" >&2
            exit 1
          fi
          if grep -rqI "liandu2024" panel; then
            echo "::warning::panel 里还有 liandu2024 字样,确认不是仓库地址后可忽略"
            grep -rnI "liandu2024" panel | cut -c1-200 | head -20
          fi

          # 4a. 上一步换仓库地址会改写 panel/server 里的个别文件(如 index.mjs),
          #     hardening-manifest.json 里记的 sha256 就对不上了,Docker 构建(scripts/build-docker.sh)会按它校验并失败。
          #     按清单列出的文件重新计算,只替换清单文本里对应的哈希串,其余格式不动。
          python3 - <<'PY'
          import hashlib, pathlib
          import json
          server = pathlib.Path('panel/server')
          mp = server / 'hardening-manifest.json'
          if mp.exists():
              text = mp.read_text(encoding='utf-8')
              files = json.loads(text).get('files', {})
              changed = []
              for name, want in files.items():
                  got = hashlib.sha256((server / name).read_bytes()).hexdigest()
                  if got != want:
                      text = text.replace(want, got)
                      changed.append(name)
              if changed:
                  mp.write_text(text, encoding='utf-8')
                  print('已按替换后的文件重算 hardening-manifest.json:', ', '.join(changed))
              else:
                  print('hardening-manifest.json 的哈希都对得上')
          PY

          for f in scripts/install.sh scripts/update.sh scripts/uninstall.sh; do sh -n "$f"; done
          if [ -f scripts/build-docker.sh ]; then
            sh -n scripts/build-docker.sh
            for f in docker/bin/*; do sh -n "$f"; done
          fi

          # 4b. 上游 terminal-test.test.mjs 在 app.listen 之后立刻读 address().port,
          #     address() 此时还是 null,测试抛 TypeError,server 没关,node --test 进程退不出来。
          #     补一句等 listening;上游自己改好后会自动跳过。每次同步覆盖 panel/ 后都要重做一遍。
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('panel/server/api/terminal-test.test.mjs')
          if p.exists():
              s = p.read_bytes().decode('utf-8')
              old = "  const server = app.listen(0, '127.0.0.1')\n  const base ="
              fix = "  if (!server.listening) await new Promise((resolve, reject) => { server.once('listening', resolve); server.once('error', reject) })\n"
              if 'listening' in s:
                  print('terminal-test.test.mjs 已经会等 listening,不处理')
              elif old in s:
                  s = s.replace(old, "  const server = app.listen(0, '127.0.0.1')\n" + fix + "  const base =")
                  p.write_bytes(s.encode('utf-8'))
                  print('已给 terminal-test.test.mjs 补上等 listening')
              else:
                  print('::warning::terminal-test.test.mjs 的 listen 写法变了,没能自动修补,请检查')
          PY

          # 5. 直接提交到目标分支
          echo "$tag" > .upstream-synced
          rm -rf app app.tar.gz components.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 前端 dist 可能被 .gitignore 忽略,强制加入 panel 下的文件
          git add -f panel
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git commit -m "sync: 上游 $tag(openwrt、debian、panel、install/update/uninstall.sh),仓库地址保持 $OWN_REPO"
          git push origin "HEAD:$BASE_BRANCH"
